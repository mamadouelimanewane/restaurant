name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Setup Bubblewrap Settings
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/settings.json

      - name: Initialize KeyStore
        run: |
          # Use absolute path for keystore relative to runner workspace
          keytool -genkeypair -v -keystore $GITHUB_WORKSPACE/keystore.jks \
            -alias teranga-key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "teranga123" -keypass "teranga123" \
            -dname "CN=TerangaReserve, OU=IT, O=Teranga, L=Dakar, S=Dakar, C=SN"

      - name: Build APK with Bubblewrap
        run: |
          # Fixing flags: --kp (keystore password), --skp (signing key password)
          # We also use --skip_pwa_check because Vercel might be slow to propagate icons
          # Note: Bubblewrap v1.18+ uses --skipPwaCheck 
          yes | bubblewrap build --manifest twa-manifest.json \
            --kp "teranga123" --skp "teranga123" --skipPwaCheck

      - name: Search for APK
        id: find_apk
        run: |
          # Look for any apk file in the current directory or child directories
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found after build!" && exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" TerangaReserve.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerangaReserve-Android-APK
          path: TerangaReserve.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-v${{ github.run_number }}"
          name: "TerangaReserve Android Application v1.0.${{ github.run_number }}"
          body: "🎉 Download the latest Android APK for TerangaReserve. Built automatically with Senegalese quality."
          draft: false
          prerelease: false
          files: TerangaReserve.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
