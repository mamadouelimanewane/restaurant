name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap Settings
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/settings.json

      - name: Initialize KeyStore (PKCS12 for modern JRE)
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias teranga-key -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 -storepass "teranga123" -keypass "teranga123" -dname "CN=TerangaReserve, OU=App, O=Teranga, L=Dakar, S=Dakar, C=SN"

      - name: Build APK with Bubblewrap (Debug + Log)
        run: |
          # We use --skipPwaCheck to be safe
          # and we print output to see what happens
          yes | bubblewrap build --manifest twa-manifest.json --kp "teranga123" --skp "teranga123" --skipPwaCheck || true
          
          # Debug: List all files to see if something was generated
          ls -R

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found after compilation." && exit 1
          fi
          echo "apk_found=$APK_PATH" >> $GITHUB_OUTPUT
          mv "$APK_PATH" TerangaReserve.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerangaReserve-Android-APK
          path: TerangaReserve.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android-v${{ github.run_number }}"
          name: "TerangaReserve Android Application v1.0.${{ github.run_number }}"
          body: "🎉 Téléchargez l'application officielle TerangaReserve (APK). Une expérience fluide et gourmande pour votre mobile."
          draft: false
          prerelease: false
          files: TerangaReserve.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
