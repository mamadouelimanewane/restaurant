name: Build Restaurant APK (Local)
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Restaurant APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: |
          rm -f yarn.lock
          npm install

      - name: Build APK (Local)
        working-directory: ./mobile
        run: npx eas-cli build --platform android --profile preview --local --non-interactive --output=./restaurant-app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-apk
          path: ./mobile/restaurant-app.apk
